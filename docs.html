<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation moved | Hammer 5 Tools</title>
  <meta name="description" content="Hammer 5 Tools documentation now lives on the Source2 Wiki.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.ico" sizes="16x16 24x24 32x32 48x48 72x72 256x256">
  <link rel="canonical" href="https://www.source2.wiki/ExternalTools/Hammer5Tools">
  <style>
    body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #0c141f; color: #c9d1d9;
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    a { color: #5ea886; }
  </style>
</head>

<body>
  <main>
    <p>Hammer 5 Tools documentation now lives on the Source2 Wiki.</p>
    <p><a id="target" href="https://www.source2.wiki/ExternalTools/Hammer5Tools">Continue to the Source2 Wiki</a></p>
  </main>

  <script>
    // Old docs.html#page-id deep links, mapped to their Source2 Wiki pages.
    const WIKI = 'https://www.source2.wiki/';
    const wikiMap = {
      'introduction': 'ExternalTools/Hammer5Tools',
      'installation': 'ExternalTools/Hammer5Tools#installation',
      'quick-start': 'ExternalTools/Hammer5Tools',
      'smartprop-guide': 'CommunityGuides/smartProps',
      'fitonline-guide': 'CommunityGuides/fitOnLine',
      'radio-sound': 'CommunityGuides/loopingRadio',
      'smart-prop-editor': 'ExternalTools/Hammer5Tools/editors/smart-prop-editor',
      'sound-editor': 'ExternalTools/Hammer5Tools/editors/sound-editor',
      'audio-editor': 'ExternalTools/Hammer5Tools/editors/audio-editor',
      'detail-prop-editor': 'ExternalTools/Hammer5Tools/editors/detail-prop-editor',
      'asset-group-maker': 'ExternalTools/Hammer5Tools/editors/asset-group',
      'hotkey-editor': 'ExternalTools/Hammer5Tools/editors/hotkey-editor',
      'loading-editor': 'ExternalTools/Hammer5Tools/editors/loading-editor',
      'explorer': 'ExternalTools/Hammer5Tools/utilities/explorer',
      'map-builder': 'ExternalTools/Hammer5Tools/utilities/map-builder',
      'git-sync': 'ExternalTools/Hammer5Tools/utilities/git-sync',
      'addon-manager': 'ExternalTools/Hammer5Tools/utilities/addon-manager',
      'cleanup': 'ExternalTools/Hammer5Tools/utilities/cleanup',
      'navmesh-radar': 'ExternalTools/Hammer5Tools/utilities/navmesh-radar',
      'unreal-porter': 'ExternalTools/Hammer5Tools/porting/unreal-porter',
      'source-porter': 'ExternalTools/Hammer5Tools/porting/source-porter',
      'writing-docs': 'HowToEdit/editing-the-wiki',
      'preferences': 'ExternalTools/Hammer5Tools/settings',
      'faq': 'ExternalTools/Hammer5Tools/faq'
    };

    const id = decodeURIComponent(location.hash.slice(1));
    // VSmart Examples has no wiki page; the local library page replaces it.
    const target = id === 'vsmart-examples'
      ? 'vsmart-library.html'
      : WIKI + (wikiMap[id] || 'ExternalTools/Hammer5Tools');

    document.getElementById('target').href = target;
    location.replace(target);
  </script>
</body>

</html>
